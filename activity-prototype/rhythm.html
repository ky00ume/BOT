<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루바토의 연주 · 리듬 게임</title><link rel="stylesheet" href="rhythm.css?v=hold-pass-2"></head><body><main class="game-shell"><header><div><a class="back-link" href="index.html">← 비전의 탑으로 돌아가기</a><small id="instrumentLabel">루바토의 리라</small><h1 id="songTitle">〈거미는 박자를 모른다〉</h1></div><div class="stats"><b id="score">000000</b><span id="combo">COMBO 0</span></div></header><section class="toolbar" aria-label="연주 설정"><label>곡 <select id="songSelect"></select></label><button class="difficulty active" data-mode="easy">EASY · 4K <kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></button><button class="difficulty" data-mode="hard">EXPERT · 8K <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd></button><label>속도 <input id="speed" type="range" min="0.75" max="1.5" step="0.05" value="1"></label><button id="start"><strong>START</strong><span>연주 시작</span></button><p class="start-help">난이도를 고른 뒤 START · 키가 판정선에 닿을 때 입력</p></section><section class="ritual"><div><small>연주 국면</small><b id="phase">주제</b></div><div><small>기억된 연주</small><b id="memory">정석 연주</b></div><div><small>마법 연주</small><span id="runes" class="runes"></span></div></section><section class="stage" id="stage" tabindex="0" aria-label="리듬게임 플레이 영역"><div class="lyrics" id="lyrics" aria-hidden="true"><span id="lyricPrev"></span><b id="lyricCurrent"></b><span id="lyricNext"></span></div><div id="lanes" class="lanes"></div><div class="judgeline"></div><div id="playcombo" class="playcombo"><b>0</b><span>COMBO</span></div><div id="judge" class="judge">READY</div><div id="countdown" class="countdown"></div></section><section id="result" class="result" aria-hidden="true"><div class="result-card"><small>PERFORMANCE RESULT</small><div class="result-rank" id="resultRank">S</div><div class="result-score"><b id="resultScore">000000</b><span id="resultAcc">100.00%</span></div><div class="result-grid"><div><span>PERFECT</span><b id="resultPerfect">0</b></div><div><span>GREAT</span><b id="resultGreat">0</b></div><div><span>GOOD</span><b id="resultGood">0</b></div><div><span>MISS</span><b id="resultMiss">0</b></div><div><span>MAX COMBO</span><b id="resultCombo">0</b></div><div><span>RUNES</span><b id="resultRunes">0 / 4</b></div></div><strong id="resultClear" class="result-clear"></strong><p id="resultRubato" class="result-rubato"></p><button id="resultAgain">다시 연주</button></div></section><footer><span id="status">난이도를 고르고 연주 시작을 누르세요.</span><span id="accuracy">ACC --%</span></footer></main><audio id="song" preload="auto" src="assets/spider_rhythm.wav"></audio><script src="rhythm.js"></script></body></html>
