[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True

# 점진적 타입 체크 (엄격하지 않게 시작)
disallow_untyped_defs = False
disallow_any_generics = False
check_untyped_defs = True

# 써드파티 라이브러리 타입 무시
[mypy-discord.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
