<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" data-character="churider" data-state="idle" data-stage="anatomy-blockout">
  <title id="title">Churider — idle anatomy blockout</title>
  <desc id="desc">A miniature drider anatomy study: pale drow upper body fused to a dark spider lower body with exactly eight spider legs. Hair, clothing, eye color, and other identity details are intentionally unspecified.</desc>
  <defs>
    <linearGradient id="chitin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2231"/>
      <stop offset="0.5" stop-color="#17131f"/>
      <stop offset="1" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="chitinHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74627c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2d2435" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eeeaf2"/>
      <stop offset="0.55" stop-color="#d6d0dc"/>
      <stop offset="1" stop-color="#aaa3b2"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .leg-back { fill:none; stroke:#17131f; stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
      .leg-front { fill:none; stroke:#211a27; stroke-width:19; stroke-linecap:round; stroke-linejoin:round; }
      .leg-hi { fill:none; stroke:#6a5872; stroke-opacity:.42; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
      .skin-line { fill:none; stroke:#918999; stroke-width:2.2; stroke-linecap:round; }
    </style>
  </defs>

